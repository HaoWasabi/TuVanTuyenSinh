<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base.html}">
<head>
    <title>Quy đổi tổ hợp</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="max-w-5xl mx-auto">
            <h1 class="text-3xl font-bold mb-6">Quy đổi tổ hợp</h1>

            <p class="mb-4 text-slate-600">Bảng ma trận chênh lệch điểm giữa các tổ hợp. Dùng để quy đổi điểm giữa các tổ hợp theo quy định.</p>

            <div class="bg-white rounded-lg shadow overflow-hidden mb-6">
                <div class="overflow-x-auto">
                    <table class="w-full table-auto text-sm">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="px-4 py-2">Tổ hợp gốc \ Tổ hợp</th>
                                <th th:each="col : ${toHopList}" class="px-4 py-2" th:text="${col}"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${matrixRows}">
                                <td class="px-4 py-2 font-semibold" th:text="${row.rowKey}"></td>
                                <td th:each="val : ${row.values}" class="px-4 py-2 text-center" th:text="${val}"></td>
                            </tr>
                        </tbody>
                    </table> </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-3">Thử quy đổi điểm</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                    <input id="inputScore" type="number" step="0.01" min="0" placeholder="Điểm tổ hợp (ví dụ 20)" class="px-3 py-2 border rounded" />
                    <select id="selectFrom" class="px-3 py-2 border rounded">
                        <option value="">-- Chọn tổ hợp nguồn --</option>
                        <option th:each="t : ${toHopList}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <button id="btnConvert" 
                            th:data-url="@{/quy-doi-to-hop/api/convert}" 
                            class="px-4 py-2 bg-blue-600 text-white rounded">
                        Quy đổi
                    </button>
                </div>
                <div id="result" class="text-lg font-semibold text-slate-700"></div>
            </div>
        </div>
    </div>

    <script layout:fragment="scripts" th:inline="javascript">
        // <![CDATA[
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
            
            const btn = document.getElementById('btnConvert');
            if (!btn) {
                console.warn('Convert button not found');
                return;
            }
            
            btn.addEventListener('click', async function() {
                const score = document.getElementById('inputScore').value;
                const from = document.getElementById('selectFrom').value;
                const resultDiv = document.getElementById('result');
                
                if (!score || !from) {
                    resultDiv.textContent = 'Vui lòng nhập đầy đủ thông tin.';
                    return;
                }

                // ĐÃ SỬA: Lấy chính xác URL động do Thymeleaf sinh ra từ thuộc tính data-url của nút bấm
                const baseUrl = btn.getAttribute('data-url');
                const requestUrl = `${baseUrl}?score=${encodeURIComponent(score.trim())}&from=${encodeURIComponent(from.trim())}`;
                
                console.log('Sending convert request to:', requestUrl);
                
                try {
                    const resp = await fetch(requestUrl);
                    console.log('convert resp status', resp.status);
                    
                    if (!resp.ok) {
                        resultDiv.textContent = `Máy chủ phản hồi lỗi (Mã lỗi: ${resp.status}).`;
                        return;
                    }

                    const responseText = await resp.text();
                    let data;
                    try {
                        data = JSON.parse(responseText);
                    } catch (e) {
                        console.error('Lỗi parse JSON:', e);
                        console.error('Nội dung phản hồi thực tế:', responseText);
                        resultDiv.innerHTML = `<div class="text-red-500 text-sm">
                            <p>Lỗi: Dữ liệu máy chủ trả về không phải JSON.</p>
                            <details class="mt-2"><summary>Xem nội dung phản hồi</summary><pre class="bg-gray-100 p-2 text-xs">${responseText.substring(0, 500)}...</pre></details>
                        </div>`;
                        return;
                    }

                    console.log('Dữ liệu quy đổi:', data);

                    // Kiểm tra nếu phía backend trả về chuỗi JSON thông báo lỗi có thuộc tính "error"
                    if (data && data.error) {
                        document.getElementById('result').textContent = 'Không thể quy đổi: ' + data.error;
                        return;
                    }

                    // Build result table
                    const keys = Object.keys(data).sort();
                    let html = '<table class="w-full text-sm mt-2 border"><thead class="bg-gray-100"><tr><th class="px-3 py-2 text-left">Tổ hợp</th><th class="px-3 py-2 text-left">Điểm quy đổi</th></tr></thead><tbody>';
                    for (const k of keys) {
                        html += `<tr class="border-b hover:bg-gray-50"><td class="px-3 py-2">${k}</td><td class="px-3 py-2 font-semibold text-blue-600">${data[k]}</td></tr>`;
                    }
                    html += '</tbody></table>';
                    resultDiv.innerHTML = html;
                    
                } catch (error) {
                    console.error('Fetch error:', error);
                    resultDiv.textContent = 'Có lỗi xảy ra kết nối với máy chủ.';
                }
            });
        });
        // ]]>
    </script>
</body>
</html>
