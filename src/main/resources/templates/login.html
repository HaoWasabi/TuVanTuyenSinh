<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base.html}">
<head>
    <title>Đăng nhập Hệ thống</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="min-h-screen bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">Đăng nhập</h1>
                </div>

                <div th:if="${user != null}" class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6">
                    <p class="text-green-700">Bạn đã đăng nhập.</p>
                    <div class="mt-3 flex gap-2">
                        <a th:href="@{/profile}" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Trang cá nhân</a>
                        <a th:href="@{/logout}" class="px-4 py-2 border border-blue-600 text-blue-600 rounded-lg">Đăng xuất</a>
                    </div>
                </div>

                <form th:unless="${user != null}" method="post" th:action="@{/login}" class="space-y-4">
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    
                    <div th:if="${errorMessage != null}" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                        <p class="text-red-700" th:text="${errorMessage}">Sai CCCD hoặc mật khẩu</p>
                    </div>

                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Số CCCD</label>
                        <input 
                            id="cccd" 
                            name="cccd" 
                            type="text" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                            placeholder="Nhập 12 số CCCD"
                            th:value="${cccd}"
                            required 
                        />
                    </div>

                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Mật khẩu</label>
                        <input 
                            id="password" 
                            name="password" 
                            type="password" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                            placeholder="Nhập mật khẩu"
                            required 
                        />
                    </div>

                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
                        Đăng nhập
                    </button>
                </form>

                <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mt-6">
                    <p class="text-sm text-gray-700"><strong>Hướng dẫn:</strong></p>
                    <ul class="text-sm text-gray-700 mt-2 list-disc list-inside">
                        <li>Nhập 12 số CCCD</li>
                        <li>Nhập mật khẩu</li>
                        <li>Ấn Đăng nhập</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
