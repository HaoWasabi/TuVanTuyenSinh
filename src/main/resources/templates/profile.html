<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base.html}">
<head>
    <title>Hồ Sơ Cá Nhân</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold mb-8">Hồ Sơ Cá Nhân</h1>

            <!-- Tabs -->
            <div class="border-b border-gray-200 mb-6">
                <div class="flex space-x-8">
                    <button id="tab-info" class="py-2 px-1 border-b-2 border-blue-600 font-medium text-blue-600">
                        Thông tin cá nhân
                    </button>
                    <button id="tab-scores" class="py-2 px-1 border-b-2 border-transparent font-medium text-gray-600 hover:text-gray-900">
                        Điểm thi
                    </button>
                    <button id="tab-security" class="py-2 px-1 border-b-2 border-transparent font-medium text-gray-600 hover:text-gray-900">
                        Bảo mật
                    </button>
                </div>
            </div>

            <!-- Tab 1: Personal Info -->
            <div id="content-info" class="space-y-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-4">Thông tin cá nhân</h2>
                    
                    <!-- Display Info -->
                    <div class="space-y-4">
                        <div class="grid md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Họ</label>
                                <p class="text-gray-900" th:text="${user.ho ?: 'N/A'}"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Tên</label>
                                <p class="text-gray-900" th:text="${user.ten ?: 'N/A'}"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">CCCD</label>
                                <p class="text-gray-900" th:text="${user.cccd}"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Ngày sinh</label>
                                <p class="text-gray-900" th:text="${user.ngaySinh ?: 'N/A'}"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Điện thoại</label>
                                <p class="text-gray-900" th:text="${user.dienThoai ?: 'N/A'}"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                <p class="text-gray-900" th:text="${user.email ?: 'N/A'}"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Giới tính</label>
                                <p class="text-gray-900" th:text="${user.gioiTinh ?: 'N/A'}"></p>
                            </div>
                        </div>
                    </div>

                    <!-- Edit Form -->
                    <form method="post" th:action="@{/profile/update}" class="mt-6 space-y-4">
                        <input type="hidden" name="csrf_token" th:value="${_csrf.token}" />
                        
                        <div class="grid md:grid-cols-2 gap-4">
                            <div>
                                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Tên</label>
                                <input id="name" name="name" type="text" 
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                       th:value="${user.ten ?: ''}" />
                            </div>
                            <div>
                                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Điện thoại</label>
                                <input id="phone" name="phone" type="tel"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                       th:value="${user.dienThoai ?: ''}" />
                            </div>
                            <div>
                                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                <input id="email" name="email" type="email"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                       th:value="${user.email ?: ''}" />
                            </div>
                            <div>
                                <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">Giới tính</label>
                                <select id="gender" name="gender"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                    <option value="">-- Chọn --</option>
                                    <option value="Nam" th:selected="${user.gioiTinh == 'Nam'}">Nam</option>
                                    <option value="Nữ" th:selected="${user.gioiTinh == 'Nữ'}">Nữ</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                            Cập nhật thông tin
                        </button>
                    </form>
                </div>
            </div>

            <!-- Tab 2: Scores -->
            <div id="content-scores" class="hidden space-y-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-4">Điểm thi</h2>
                    
                    <div th:if="${scores != null and scores.size() > 0}">
                        <div class="grid md:grid-cols-2 gap-4">
                            <div th:each="score : ${scores}">
                                <label class="block text-sm font-medium text-gray-700 mb-1" 
                                       th:text="${score.subjectName}"></label>
                                <p class="text-lg font-semibold text-gray-900" th:text="${score.score}"></p>
                            </div>
                        </div>
                    </div>
                    <div th:if="${scores == null or scores.size() == 0}">
                        <p class="text-gray-500">Chưa có dữ liệu điểm thi</p>
                    </div>
                </div>
            </div>

            <!-- Tab 3: Security -->
            <div id="content-security" class="hidden space-y-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-4">Đổi mật khẩu</h2>
                    
                    <form method="post" th:action="@{/profile/change-password}" class="space-y-4 max-w-md">
                        <input type="hidden" name="csrf_token" th:value="${_csrf.token}" />
                        
                        <div>
                            <label for="old-password" class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu hiện tại</label>
                            <input id="old-password" name="oldPassword" type="password" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500" />
                        </div>

                        <div>
                            <label for="new-password" class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu mới</label>
                            <input id="new-password" name="newPassword" type="password" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500" />
                        </div>

                        <div>
                            <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Xác nhận mật khẩu</label>
                            <input id="confirm-password" name="confirmPassword" type="password" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500" />
                        </div>

                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                            Đổi mật khẩu
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script layout:fragment="scripts">
        lucide.createIcons();
        
        // Tab switching
        document.getElementById('tab-info').addEventListener('click', function() {
            document.querySelectorAll('[id^="content-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById('content-info').classList.remove('hidden');
            document.querySelectorAll('[id^="tab-"]').forEach(el => {
                el.classList.remove('border-blue-600', 'text-blue-600');
                el.classList.add('border-transparent', 'text-gray-600');
            });
            this.classList.add('border-blue-600', 'text-blue-600');
            this.classList.remove('border-transparent', 'text-gray-600');
        });

        document.getElementById('tab-scores').addEventListener('click', function() {
            document.querySelectorAll('[id^="content-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById('content-scores').classList.remove('hidden');
            document.querySelectorAll('[id^="tab-"]').forEach(el => {
                el.classList.remove('border-blue-600', 'text-blue-600');
                el.classList.add('border-transparent', 'text-gray-600');
            });
            this.classList.add('border-blue-600', 'text-blue-600');
            this.classList.remove('border-transparent', 'text-gray-600');
        });

        document.getElementById('tab-security').addEventListener('click', function() {
            document.querySelectorAll('[id^="content-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById('content-security').classList.remove('hidden');
            document.querySelectorAll('[id^="tab-"]').forEach(el => {
                el.classList.remove('border-blue-600', 'text-blue-600');
                el.classList.add('border-transparent', 'text-gray-600');
            });
            this.classList.add('border-blue-600', 'text-blue-600');
            this.classList.remove('border-transparent', 'text-gray-600');
        });
    </script>
</body>
</html>
