<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base.html}">
<head>
    <title>Điểm Thi Cá Nhân</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Đã thêm .doubleValue() để ép kiểu BigDecimal về Double, tránh lỗi ClassCastException khi sort -->
        <div class="max-w-4xl mx-auto"
             th:with="diemKhuvucCalc=${khuvuc == 'KV1' ? 0.75 : (khuvuc == 'KV2-NT' ? 0.5 : (khuvuc == 'KV2' ? 0.25 : 0))},
                      diemDoiTuongCalc=${doiTuong == 'UT1' ? 2 : (doiTuong == 'UT2' ? 1 : 0)},
                      tongDiemCong=${diemKhuvucCalc + diemDoiTuongCalc},
                      listDiem=${ {
                          diem?.toan?.doubleValue() ?: 0.0, 
                          diem?.nguVan?.doubleValue() ?: 0.0, 
                          diem?.n1Thi?.doubleValue() ?: 0.0, 
                          diem?.vatLi?.doubleValue() ?: 0.0, 
                          diem?.hoaHoc?.doubleValue() ?: 0.0, 
                          diem?.sinhHoc?.doubleValue() ?: 0.0, 
                          diem?.lichSu?.doubleValue() ?: 0.0, 
                          diem?.diaLi?.doubleValue() ?: 0.0
                      } },
                      sortedDiem=${#lists.sort(listDiem)},
                      tong3Mon=${sortedDiem[7] + sortedDiem[6] + sortedDiem[5]},
                      diemTam=${tong3Mon + tongDiemCong},
                      tongDiemCuoiCung=${diemTam > 30.0 ? 30.0 : diemTam}">
            
            <h1 class="text-3xl font-bold mb-8">Điểm Thi Của Bạn</h1>

            <!-- Student Info & Admission Info -->
            <div class="bg-white rounded-lg shadow p-6 mb-8">
                <!-- Thông tin cá nhân -->
                <div class="grid md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">Họ và tên</label>
                        <p class="text-lg font-medium" th:text="${(user.ho ?: '') + ' ' + (user.ten ?: '')}"></p>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">CCCD</label>
                        <p class="text-lg font-medium" th:text="${user.cccd}"></p>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">Ngày sinh</label>
                        <p class="text-lg font-medium" th:text="${user.ngaySinh ?: 'N/A'}"></p>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1" title="Điểm 3 môn cao nhất + điểm ưu tiên (Tối đa 30)">Điểm tổng</label>
                        <!-- Hiển thị điểm đã tính toán và chặn trần 30 -->
                        <p class="text-2xl font-bold text-blue-600" th:text="${tongDiemCuoiCung}"></p>
                    </div>
                </div>

                <!-- Thông tin xét tuyển (Thêm mới) -->
                <div class="mt-6 pt-6 border-t grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">Ngành xét tuyển</label>
                        <!-- Lấy biến tenNganh được đẩy từ Controller xuống -->
                        <p class="text-xl font-semibold text-indigo-700" th:text="${tenNganh ?: 'Chưa cập nhật'}"></p>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">Phương thức xét tuyển</label>
                        <p class="text-xl font-semibold text-indigo-700">Điểm thi THPT</p>
                    </div>
                </div>
            </div>

            <!-- Scores Grid -->
            <div class="grid md:grid-cols-2 gap-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-4">Điểm bài thi</h2>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center pb-2 border-b">
                            <span class="text-gray-600">Toán</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.toan}"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b">
                            <span class="text-gray-600">Văn</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.nguVan}"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b">
                            <span class="text-gray-600">Tiếng Anh</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.n1Thi}"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b">
                            <span class="text-gray-600">Lý</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.vatLi}"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b">
                            <span class="text-gray-600">Hóa</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.hoaHoc}"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b">
                            <span class="text-gray-600">Sinh</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.sinhHoc}"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b">
                            <span class="text-gray-600">Sử</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.lichSu}"></span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">Địa</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.diaLi}"></span>
                        </div>
                    </div>
                </div>

                <!-- Bonus Points Info -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-4">Thông tin tính điểm</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Tổng 3 môn cao nhất</label>
                            <div class="text-lg font-medium">
                                <span class="text-blue-600 font-bold" th:text="${tong3Mon} + ' điểm'"></span>
                            </div>
                        </div>
                        <div class="pt-2">
                            <label class="block text-sm text-gray-600 mb-1">Khu vực</label>
                            <div class="text-lg font-medium">
                                <span th:text="${khuvuc}"></span>
                                <span class="text-blue-600 ml-2" th:text="${'(' + diemKhuvucCalc + ' điểm)'}"></span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Đối tượng ưu tiên</label>
                            <div class="text-lg font-medium">
                                <span th:text="${doiTuong}"></span>
                                <span class="text-blue-600 ml-2" th:text="${'(' + diemDoiTuongCalc + ' điểm)'}"></span>
                            </div>
                        </div>
                        <div class="pt-4 border-t">
                            <label class="block text-sm text-gray-600 mb-1">Tổng điểm cộng</label>
                            <p class="text-2xl font-bold text-green-600" th:text="${tongDiemCong} + ' điểm'"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-8 flex gap-4">
                <a href="/nguyen-vong" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    Xem danh sách nguyện vọng
                </a>
            </div>
        </div>
    </div>
    <script layout:fragment="scripts">
        lucide.createIcons();
    </script>
</body>
</html>
