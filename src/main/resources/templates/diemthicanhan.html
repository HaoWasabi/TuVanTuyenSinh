<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base.html}">
<head>
    <title>Điểm Thi Cá Nhân</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold mb-8">Điểm Thi Của Bạn</h1>

            <!-- Student Info -->
            <div class="bg-white rounded-lg shadow p-6 mb-8">
                <div class="grid md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">Họ và tên</label>
                        <p class="text-lg font-medium" th:text="${(user.ho ?: '') + ' ' + (user.ten ?: '')}"></p>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">CCCD</label>
                        <p class="text-lg font-medium" th:text="${user.cccd}"></p>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">Ngày sinh</label>
                        <p class="text-lg font-medium" th:text="${user.ngaySinh ?: 'N/A'}"></p>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">Điểm tổng</label>
                        <p class="text-2xl font-bold text-blue-600" th:text="${tongDiem}"></p>
                    </div>
                </div>
            </div>

            <!-- Scores Grid -->
            <div class="grid md:grid-cols-2 gap-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-4">Điểm bài thi</h2>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center pb-2 border-b">
                            <span class="text-gray-600">Toán</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.toan}"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b">
                            <span class="text-gray-600">Văn</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.nguVan}"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b">
                            <span class="text-gray-600">Tiếng Anh</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.n1Thi}"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b">
                            <span class="text-gray-600">Lý</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.vatLi}"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b">
                            <span class="text-gray-600">Hóa</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.hoaHoc}"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b">
                            <span class="text-gray-600">Sinh</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.sinhHoc}"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b">
                            <span class="text-gray-600">Sử</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.lichSu}"></span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">Địa</span>
                            <span class="text-2xl font-bold text-blue-600" th:text="${diem?.diaLi}"></span>
                        </div>
                    </div>
                </div>

                <!-- Bonus Points Info -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-4">Thông tin tính điểm</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Khu vực</label>
                            <div class="text-lg font-medium">
                                <span th:text="${khuvuc}"></span>
                                <span class="text-blue-600 ml-2" th:text="${'(' + diemKhuvuc + ' điểm)'}"></span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Đối tượng ưu tiên</label>
                            <div class="text-lg font-medium">
                                <span th:text="${doiTuong}"></span>
                                <span class="text-blue-600 ml-2" th:text="${'(' + diemDoiTuong + ' điểm)'}"></span>
                            </div>
                        </div>
                        <div class="pt-4 border-t">
                            <label class="block text-sm text-gray-600 mb-1">Tổng điểm cộng</label>
                            <p class="text-2xl font-bold text-green-600" th:text="${(diemKhuvuc + diemDoiTuong) ?: '0'} + ' điểm'"></p>
                        </div>
                    </div>
                </div>
            </div>


            <!-- Action Buttons -->
            <div class="mt-8 flex gap-4">
                <a href="/nguyen-vong" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    Xem danh sách nguyện vọng
                </a>
            </div>
        </div>
    </div>
    <script layout:fragment="scripts">
        lucide.createIcons();
    </script>
</body>
</html>
